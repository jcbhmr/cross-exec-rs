[package]
name = "cross-exec"
version = "0.1.2"
edition = "2024"
license = "MIT"
description = "⚡️ Unix CommandExt::exec but isomorphic"
homepage = "https://docs.rs/cross-exec"
repository = "https://github.com/jcbhmr/cross-exec-rs"
keywords = ["exec"]
categories = []
exclude = [".github", ".devcontainer", ".vscode"]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_System_Console"] }
